<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mile 1 Outreach</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: a pipeline list on the left, one prospect's workspace on the right. Stage progress is drawn
   as the Mile 1 mark itself: bars that climb toward the first milestone. */
:root{
  --font:'Satoshi','DM Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F7F7F7; --side:#EDE8E0; --card:#FFFFFF; --line:#DAD4CA; --line-soft:#E6E1D8;
  --fg:#0F0F10; --mute:#66666A; --faint:#B8B8BB;
  --blue:#3355FF; --blue-ink:#3355FF; --on-blue:#F7F7F7;
  --ok:#1F7A4D; --warn:#955A00; --bad:#B3261E;
  --r:8px; --r-s:6px; --r-xs:3px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F10; --side:#141415; --card:#1A1A1C; --line:#2C2C2F; --line-soft:#232326;
  --fg:#F7F7F7; --mute:#B8B8BB; --faint:#5A5A5E;
  --blue:#3355FF; --blue-ink:#8DA0FF; --on-blue:#F7F7F7;
  --ok:#5FD39A; --warn:#F0B14A; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F10; --side:#141415; --card:#1A1A1C; --line:#2C2C2F; --line-soft:#232326;
  --fg:#F7F7F7; --mute:#B8B8BB; --faint:#5A5A5E;
  --blue:#3355FF; --blue-ink:#8DA0FF; --on-blue:#F7F7F7;
  --ok:#5FD39A; --warn:#F0B14A; --bad:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:22px;margin:0;min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;flex:none}
.logo svg{display:block}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font-weight:700;font-size:22px;letter-spacing:-.5px}
.logo .wm i{font-style:normal;font-size:7px;letter-spacing:.36em;color:var(--mute);margin-top:3px;font-weight:500}
.grow{flex:1}
.divider{width:1px;height:22px;background:var(--line);margin:0 4px}
.crumb{font-size:12px;color:var(--mute);letter-spacing:.02em}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:var(--r-s);font-weight:500;font-size:13px;line-height:18px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px;line-height:16px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;padding:2px 0;color:var(--blue-ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:10px;line-height:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=url],input[type=date],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:22px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{border-color:var(--blue-ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-ink) 22%,transparent)}
.hint{font-size:12px;line-height:18px;color:var(--mute)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10px;line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:var(--r-xs);background:color-mix(in srgb,var(--blue-ink) 13%,transparent);color:var(--blue-ink);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.mute{background:color-mix(in srgb,var(--mute) 14%,transparent);color:var(--mute)}

/* shell */
.shell{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:0;align-items:start}
.list{background:var(--side);border-left:1px solid var(--line);border-right:1px solid var(--line);position:sticky;top:calc(61px + env(safe-area-inset-top,0px));max-height:calc(100vh - 61px - env(safe-area-inset-top,0px));overflow:auto;min-height:calc(100vh - 61px)}
.detail{padding:28px 0 80px 32px;min-width:0}
.list-head{padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;background:var(--side);z-index:2;border-bottom:1px solid var(--line)}
.funnel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.fchip{flex:none;border:1px solid var(--line);background:transparent;border-radius:var(--r-xs);padding:3px 8px;font-size:12px;line-height:18px;cursor:pointer;color:var(--mute);display:inline-flex;gap:6px}
.fchip b{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:700}
.fchip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip[aria-pressed=true] b{color:var(--bg)}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.row[aria-current=true]{background:var(--card);box-shadow:inset 3px 0 0 var(--blue)}
.row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .nm{font-weight:700;font-size:15px;line-height:22px;overflow-wrap:anywhere}
.row .site{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.row .next{font-size:12px;line-height:18px;color:var(--mute);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.empty-list{padding:28px 16px;color:var(--mute)}

/* detail */
.back{display:none}
.show-s{display:none}
.dhead{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.dhead h1{font-size:30px;line-height:38px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:13px;align-items:center}
.meta a{color:var(--blue-ink);font-weight:500}
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;margin:6px 0 4px;max-width:640px}
.step{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;min-width:0}
.step .bar-b{height:calc(8px + var(--i) * 4px);background:var(--line);border-radius:2px;transition:background .15s}
.step.done .bar-b{background:var(--fg)}
.step.cur .bar-b{background:var(--blue)}
.step span{font-size:11px;line-height:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.cur span{color:var(--fg);font-weight:700}
.step:hover .bar-b{background:var(--faint)}
.step.cur:hover .bar-b{background:var(--blue)}
.nextline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0 0;max-width:640px}
.nextline .lbl{flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 22px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;margin-bottom:-1px;font-weight:500;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--blue);font-weight:700}
.tab small{font-size:11px;margin-left:6px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
.pane{display:flex;flex-direction:column;gap:18px;max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:18px;line-height:26px;margin:0;font-weight:700}
.card h2{font-size:24px;line-height:32px;margin:0;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* gaps */
.hook{background:var(--blue);color:var(--on-blue);border-radius:var(--r);padding:18px 20px}
.hook .lbl{color:color-mix(in srgb,var(--on-blue) 78%,transparent)}
.hook p{margin:6px 0 0;font-size:18px;line-height:26px;font-weight:700;text-wrap:pretty}
.gap{display:flex;flex-direction:column;gap:8px}
.gap .gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gap .area{font-weight:700;font-size:15px}
.gap p{margin:0}
.gap .fix{border-top:1px solid var(--line-soft);padding-top:8px;color:var(--mute)}
.gap .fix b{color:var(--fg)}
.gap.lead{border-color:var(--blue)}
.verify li{margin:2px 0}

/* contacts */
.poc{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.poc h3{font-size:16px;line-height:24px}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.role{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:var(--r-xs);padding:4px 9px;text-decoration:none;color:var(--fg);font-size:13px;background:var(--bg)}
.role:hover{border-color:var(--blue-ink)}

/* messages */
.msg{display:flex;flex-direction:column;gap:12px}
.msg.next{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.msg header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.msg header h3{margin-top:4px}
.msg .opts{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:12px;align-items:end}
.msg textarea{min-height:150px}
.msg .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1;min-width:8px}
.wc{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.thinking::after{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;margin-left:6px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.thinking::after{animation:none}}

/* activity */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.log time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

/* welcome */
.welcome{max-width:640px;display:flex;flex-direction:column;gap:20px}
.banner{background:var(--blue);color:var(--on-blue);border-radius:var(--r);padding:26px 28px}
.banner h2{font-size:40px;line-height:46px;margin:0;font-weight:700;letter-spacing:-.01em}
.banner p{margin:8px 0 0;color:color-mix(in srgb,var(--on-blue) 85%,transparent)}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.flow div{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--mute)}
.flow div i{display:block;background:var(--fg);border-radius:2px;height:calc(8px + var(--i) * 4px)}

/* overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 40%,transparent);z-index:40;display:flex;justify-content:flex-end;align-items:stretch}
.overlay.center{justify-content:center;align-items:flex-start;padding:max(56px,env(safe-area-inset-top,0px)) 16px 16px}
.sheet{background:var(--bg);border:1px solid var(--line);width:min(480px,100%);padding:22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.overlay.center .sheet{border-radius:var(--r);max-height:calc(100vh - 80px)}
.sheet h2{font-size:24px;line-height:32px;margin:0}
.topnote{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--fg);padding:8px 0;font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-s);z-index:60;max-width:min(520px,calc(100vw - 32px));font-size:13px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .list{position:static;max-height:none;min-height:0;border:0;border-top:0}
  .list-head{top:calc(61px + env(safe-area-inset-top,0px))}
  .detail{padding:18px 0 80px}
  .shell[data-view=detail] .list{display:none}
  .shell[data-view=list] .detail{display:none}
  .back{display:inline-flex}
  .dhead h1{font-size:26px;line-height:32px}
  .two,.msg .opts{grid-template-columns:minmax(0,1fr)}
  .banner h2{font-size:32px;line-height:38px}
  .crumb,.divider{display:none}
  .hide-s{display:none}
  .show-s{display:inline}
  .stepper{gap:4px}
  .step span{font-size:10px;letter-spacing:-.02em}
  .bar{gap:8px}
  .bar .btn{padding:7px 11px}
  .list{overflow:visible}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap bar">
  <a class="logo" href="#" aria-label="Mile 1, Start Right">
    <svg width="30" height="26" viewBox="0 0 56 48" aria-hidden="true"><g fill="currentColor"><rect x="0" y="24" width="13" height="24" rx="1.5"/><rect x="18" y="10" width="13" height="38" rx="1.5"/><rect x="32" y="0" width="24" height="11" rx="1.5"/><rect x="45" y="0" width="11" height="30" rx="1.5"/></g></svg>
    <span class="wm"><b>Mile 1</b><i>START RIGHT</i></span>
  </a>
  <span class="divider"></span><span class="crumb">Outreach</span>
  <span class="grow"></span>
  <span id="dueChip"></span>
  <button class="btn ghost" id="btnSettings" data-act="settings-open" type="button"><span class="hide-s">Sender profile</span><span class="show-s">Profile</span></button>
  <button class="btn primary" id="btnAdd" data-act="add-open" type="button">Add prospect</button>
</div></div>
<div id="banner"></div>
<main class="wrap"><div class="shell" id="shell" data-view="list">
  <aside class="list" id="list" aria-label="Pipeline"></aside>
  <section class="detail" id="detail" aria-live="polite"></section>
</div></main>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="/shim.js"></script>
<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const STAGES=[
  {k:'prospect',l:'Prospect'},{k:'gaps',l:'Gaps'},{k:'poc',l:'POC'},{k:'outreach',l:'Outreach'},
  {k:'followup',l:'Follow-up'},{k:'meeting',l:'Meeting'},{k:'won',l:'Converted'}];
const SLOTS=[
  {k:'outreach',t:'First message',tag:'Outreach',day:'Day 0',ch:'LinkedIn DM',needs:true,
   brief:'This is the first message. Open with one specific observation about their content, drawn from the lead gap. Say in one line what you would look at first. End with one easy question, for example whether a short teardown of it would be useful.'},
  {k:'fu1',t:'Follow-up 1',tag:'Follow-up',day:'Day 3',ch:'LinkedIn DM',needs:true,
   brief:'They have not replied to the first message, sent about 3 days ago. Do not say "following up", "bumping" or "circling back". Add something new: a second observation or a small, concrete idea for fixing the lead gap. Keep it to a few sentences.'},
  {k:'fu2',t:'Follow-up 2',tag:'Follow-up',day:'Day 7',ch:'Email',needs:true,
   brief:'No reply after about a week. Offer something tangible and free, such as a one-page teardown of their content or three post or page angles for the gap. Say what it contains. Make saying yes a one-word reply.'},
  {k:'final',t:'Closing the loop',tag:'Follow-up',day:'Day 14',ch:'Email',needs:false,
   brief:'Last message in the sequence, about two weeks after the first. Short and calm. Say you will stop here, leave the door open, and give them the single most useful observation as a parting note. No guilt, no pressure.'},
  {k:'meeting',t:'Meeting confirmation',tag:'Meeting',day:'Booked',ch:'Email',needs:false,
   brief:'They agreed to a meeting. Confirm it. Use [date and time] as a placeholder if the time is unknown. List what the call will cover in three short points based on the gaps, and ask them to send anything useful beforehand, such as analytics access or recent campaign work.'},
  {k:'kickoff',t:'Kickoff note',tag:'Converted',day:'Won',ch:'Email',needs:false,
   brief:'They have become a client. Write a welcome note. Say what happens in the first week, what Mile 1 needs from them, and who they will hear from. Confident and plain, no celebration language.'}
];
const SEQ=['outreach','fu1','fu2','final'];
const WAIT={fu1:3,fu2:4,final:7};
const CHANNELS=['LinkedIn DM','LinkedIn connection note','Email','WhatsApp'];
const DEFAULT_PROFILE={
  senderName:'Joel',senderRole:'',
  offer:'Mile 1 is a strategy and growth consultancy. We work out what a brand\'s customers actually want, then build the content and creative around that and measure what happens. Strategy, creativity, growth.',
  proof:'',booking:'',voice:''};
const VOICE_RULES=[
  'Write like a sharp strategist writing to one person, not a marketer writing to a list.',
  'Use short, plain sentences. Greet by first name only.',
  'Make exactly one specific observation and one easy ask.',
  'Never flatter. Never open with a compliment.',
  'Never use em dashes or en dashes. Never use emojis or exclamation marks. No bullet lists. No bold.',
  'Never write: "I hope this finds you well", "I came across", "reaching out", "touch base", "circle back", "quick call", "synergy", "game-changer", "unlock", "elevate", "leverage", "delve", "in today\'s", "landscape", "journey".',
  'Do not use the pattern "not X, but Y" and do not open with a rhetorical question.',
  'Do not invent numbers, results, clients, quotes or facts about the company. If the lead observation is marked inferred, phrase it as something you noticed, without figures.',
  'Sign off with the sender\'s first name only. No "Best regards".'
].join('\n- ');

/* ---------- state ---------- */
const state={clients:{},settings:{...DEFAULT_PROFILE},sel:null,filter:'all',q:'',loaded:false,mode:'none',
  ui:{tab:'gaps',addPoc:false,editPoc:null,editHead:false,confirmDel:false}};
const busy=new Set();
const pendingEdits=new Map(); // client id -> count of unsent edits
let API=null, toastTimer=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();
const DAY=864e5;
const daysSince=iso=>Math.floor((Date.now()-new Date(iso).getTime())/DAY);
const fmt=iso=>iso?new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'';
const fmtLong=iso=>iso?new Date(iso).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}):'';
const rid=()=>Math.random().toString(36).slice(2,8);
const stageIdx=k=>STAGES.findIndex(s=>s.k===k);
const stageLabel=k=>k==='parked'?'Parked':(STAGES[stageIdx(k)]||{l:k}).l;
const isPlain=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(t,s){for(const k in s){const v=s[k];
  if(isPlain(v)&&v.__delete__){delete t[k];}
  else if(isPlain(v)){if(!isPlain(t[k]))t[k]={};deepMerge(t[k],v);}
  else t[k]=Array.isArray(v)?v.slice():v;}return t}
function nest(path,val){const parts=path.split('.');const o={};let c=o;parts.forEach((p,i)=>{if(i===parts.length-1)c[p]=val;else{c[p]={};c=c[p];}});return o}
function hostOf(u){try{return new URL(/^https?:\/\//i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'')}catch{return ''}}
function normUrl(u){u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u}
function titleFromHost(h){const b=(h||'').split('.')[0].replace(/[-_]+/g,' ');return b.replace(/\b\w/g,c=>c.toUpperCase())}
function words(s){return (String(s||'').trim().match(/\S+/g)||[]).length}
function toast(msg,ms=4200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},ms)}
async function use(name){try{return (await window.claude?.use?.(name))||null}catch{return null}}
function errCopy(e){const c=e&&e.code;
  return ({not_granted:'Claude access was declined for this page. Allow it when asked to draft.',
  rate_limited:'Too many requests just now. Wait a minute and try again.',
  invalid_json:'Claude replied in a shape the page could not read. Try again.',
  refused:'Claude declined that input. Change the notes and try again.',
  empty_completion:'Claude returned nothing. Try again with more detail in the notes.',
  sampling_disabled:'Claude is not available. Check the server\'s ANTHROPIC_API_KEY.',not_configured:'The server has no ANTHROPIC_API_KEY set yet.',prompt_too_large:'That is too much text. Trim the notes.',
  session_expired:'Sign in again to use Claude.',
  cancelled:''})[c]??'That did not go through. Try again.'}

/* ---------- persistence ---------- */
const queues=new Map();
function enqueue(id,fn){const p=(queues.get(id)||Promise.resolve()).then(fn).catch(e=>{toast(e&&e.code==='quota_exceeded'?'The saved-data limit is full. Delete old prospects to continue.':'Could not save that change. Check your connection.')});queues.set(id,p);return p}
function localApply(id,data){const c=state.clients[id];if(!c)return;deepMerge(c,data);c.updatedAt=nowIso()}
function remote(id,data){
  if(!API)return Promise.resolve();
  return enqueue(id,()=>API.col.doc(id).update({...data,updatedAt:nowIso()}));
}
function patch(id,data){localApply(id,data);return remote(id,data)}
const editTimers=new Map();
function edit(id,path,val){
  const key=id+'|'+path;const data=nest(path,val);localApply(id,data);
  if(!editTimers.has(key))pendingEdits.set(id,(pendingEdits.get(id)||0)+1);
  clearTimeout(editTimers.get(key));
  editTimers.set(key,setTimeout(async()=>{editTimers.delete(key);
    try{await remote(id,nest(path,state.clients[id]?path.split('.').reduce((o,k)=>o&&o[k],state.clients[id]):val))}
    finally{pendingEdits.set(id,Math.max(0,(pendingEdits.get(id)||1)-1))}},650));
}
async function createClient(id,data){state.clients[id]=data;if(API)await enqueue(id,()=>API.col.doc(id).set(data))}
async function removeClient(id){delete state.clients[id];if(API)await enqueue(id,()=>API.col.doc(id).delete())}
async function saveSettings(p){state.settings={...DEFAULT_PROFILE,...p};if(API)try{await API.db.doc('settings/profile').set(state.settings)}catch{toast('Could not save the sender profile.')}}
function log(id,text){const c=state.clients[id];if(!c)return;const l=[{at:nowIso(),text},...(c.log||[])].slice(0,60);return patch(id,{log:l})}

/* ---------- pipeline logic ---------- */
function dueInfo(c){
  if(!['outreach','followup'].includes(c.stage))return null;
  let lastIdx=-1,last=null;
  SEQ.forEach((k,i)=>{const s=c.messages&&c.messages[k]&&c.messages[k].sentAt;if(s){lastIdx=i;last=s}});
  if(lastIdx<0)return{kind:'send',slot:'outreach'};
  const next=SEQ[lastIdx+1];
  if(!next)return{kind:'done'};
  const days=daysSince(last),wait=WAIT[next];
  return{kind:days>=wait?'due':'wait',slot:next,days,wait,left:wait-days};
}
function nextAction(c){
  const g=c.gaps&&c.gaps.items&&c.gaps.items.length;const p=(c.pocs||[]).length;
  switch(c.stage){
    case 'prospect':return{t:g?'Gaps found. Review them.':'Run the content gap read',tone:''};
    case 'gaps':return{t:g?'Find the person who owns content':'Run the content gap read',tone:''};
    case 'poc':return{t:p?'Draft the first message':'Add a contact',tone:''};
    case 'outreach':case 'followup':{
      const d=dueInfo(c);const sl=d&&SLOTS.find(s=>s.k===d.slot);
      if(!d)return{t:'',tone:''};
      if(d.kind==='send')return{t:'Send the first message',tone:'warn'};
      if(d.kind==='due')return{t:`${sl.t} is due (${d.days}d since last message)`,tone:'warn',due:true};
      if(d.kind==='wait')return{t:`${sl.t} in ${d.left} day${d.left===1?'':'s'}`,tone:''};
      return{t:'Sequence finished. Park it or move it on.',tone:''};}
    case 'meeting':return{t:c.meetingAt?`Meeting ${fmtLong(c.meetingAt)}`:'Add the meeting date',tone:''};
    case 'won':return{t:c.messages&&c.messages.kickoff&&c.messages.kickoff.sentAt?'Onboarding':'Send the kickoff note',tone:''};
    case 'parked':return{t:'Parked',tone:''};
  }
  return{t:'',tone:''};
}
function leadGap(c){const it=(c.gaps&&c.gaps.items)||[];return it.find(x=>x.lead)||it[0]||null}
function primaryPoc(c){const p=c.pocs||[];return p.find(x=>x.primary)||p[0]||null}
function setStage(id,k,why){
  const c=state.clients[id];if(!c||c.stage===k)return;
  const data={stage:k};if(k==='parked')data.prevStage=c.stage;
  patch(id,data);log(id,why||`Moved to ${stageLabel(k)}`);
}

/* ---------- AI ---------- */
function aboutBlock(){const p=state.settings;
  return `About Mile 1: ${p.offer}\nSender: ${p.senderName||'the sender'}${p.senderRole?', '+p.senderRole:''}\nProof points the sender supplied (use only these, never invent results): ${p.proof||'none supplied'}\nBooking link: ${p.booking||'none'}${p.voice?'\nExtra voice notes: '+p.voice:''}`}
function gapPrompt(c){
  return `You are a content strategist at Mile 1. Mile 1 finds the gaps in a brand's content and fixes them. Work out where this prospect's content is weak so the team can write a specific, credible outreach message.

${aboutBlock()}

Prospect: ${c.name}
Website: ${c.website||'not given'}
Industry: ${c.industry||'not given'}
Notes pasted by the Mile 1 team (homepage copy, bios, captions, observations):
"""
${(c.notes||'').slice(0,12000)||'(none)'}
"""

You cannot browse. The notes may include text the server fetched from the website (marked "Fetched from website"). Rely on the notes first. You may add what you reliably know about this company, and you must mark those points basis "inferred". If the notes are thin and you do not know the company, say so in "confidence" and return fewer gaps. Never invent follower counts, traffic, revenue, campaign names or quotes.

Look for 3 to 5 gaps in their CONTENT only: positioning and message clarity, proof such as case studies and reviews, cadence and consistency, format mix (video, short-form, long-form), search discoverability, the path from content to enquiry (calls to action, landing pages, lead capture), and how well the voice reflects what customers want.

Write plainly. No em dashes. No hype words.

Reply with only this JSON:
{"summary":"two plain sentences on the state of their content","hook":"the single most useful observation for outreach, one sentence, worded so it could be said to the prospect, no flattery","confidence":"high|medium|low","gaps":[{"area":"short label","severity":"high|medium|low","finding":"what is missing or weak, one or two sentences","evidence":"what in the notes or their public presence points to this","fix":"what Mile 1 would do first, one sentence","basis":"notes|inferred"}],"target_roles":["up to 4 job titles most likely to own content decisions at a company of this size and type"],"check_next":["one to three things to check on the site before messaging"]}`}
function msgPrompt(c,slot,tweak){
  const S=SLOTS.find(s=>s.k===slot);const m=(c.messages&&c.messages[slot])||{};
  const ch=m.channel||S.ch;const p=primaryPoc(c);const lead=leadGap(c);
  const others=((c.gaps&&c.gaps.items)||[]).filter(x=>x!==lead).slice(0,3).map(x=>`- ${x.area}: ${x.finding}`).join('\n')||'none';
  const prev=SLOTS.filter(s=>s.k!==slot&&c.messages&&c.messages[s.k]&&c.messages[s.k].body).map(s=>`[${s.t}, ${c.messages[s.k].channel||s.ch}]\n${c.messages[s.k].body}`).join('\n\n')||'none yet';
  const len={'LinkedIn DM':'Body 40 to 70 words.','LinkedIn connection note':'Body must be under 280 characters, since it is a connection note.','Email':'Body 70 to 110 words. Subject line of 2 to 6 words, plain and specific, no clickbait.','WhatsApp':'Body 30 to 60 words.'}[ch];
  return `Write one outbound message for Mile 1.

${aboutBlock()}

Message slot: ${S.t}. Channel: ${ch}.
Recipient: ${p?p.name+(p.role?', '+p.role:''):'unknown contact, so address it without a name'} at ${c.name}
Company website: ${c.website||'not given'}. Industry: ${c.industry||'not given'}.

Lead observation (${lead?lead.basis==='inferred'?'inferred, not verified':'from the team\'s notes':'none'}):
${lead?`${lead.area}: ${lead.finding}\nEvidence: ${lead.evidence}\nWhat Mile 1 would do first: ${lead.fix}`:'No gap read has been run, so keep the message modest and do not claim specifics.'}
Hook: ${(c.gaps&&c.gaps.hook)||'none'}
Other gaps:
${others}
${c.meetingAt?'Meeting date: '+fmtLong(c.meetingAt)+'\n':''}
Earlier messages in this sequence (do not repeat their wording):
${prev}

Brief for this slot: ${S.brief}
${len}
${m.body&&tweak?`\nCurrent draft:\n"""\n${m.body}\n"""\nRevise it: ${tweak}`:''}

Voice rules:
- ${VOICE_RULES}

Reply with only this JSON: {"subject":"","body":""}. Leave subject empty unless the channel is Email.`}
function clean(s){return String(s||'').replace(/\s*[—–]\s*/g,', ').replace(/^["“]|["”]$/g,'').trim()}

async function fetchSite(id,silent){
  const c=state.clients[id];if(!c||!c.website)return;
  if(!silent){busy.add('site:'+id);render(true)}
  try{
    const r=await fetch('/api/fetch-site',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:c.website})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.message||'Could not read that website.');
    const stamp='Fetched from website on '+fmt(nowIso())+':\n'+j.text;
    await patch(id,{notes:(c.notes?c.notes.trim()+'\n\n':'')+stamp});
    log(id,'Read website text');
  }catch(e){if(silent)throw e;toast(e.message||'Could not read that website.')}
  finally{if(!silent){busy.delete('site:'+id);render(true)}}
}
async function runGaps(id){
  const c=state.clients[id];if(!c||busy.has('gaps:'+id))return;
  const sample=await use('sample');if(!sample){toast('Claude is not available in this view.');return}
  busy.add('gaps:'+id);render(true);
  try{
    if(!(c.notes||'').trim()&&c.website){try{await fetchSite(id,true)}catch(e){}}
    const r=await sample.json(gapPrompt(c),{cache:false});
    if(!r||!Array.isArray(r.gaps)||!r.gaps.length)throw{code:'invalid_json'};
    const items=r.gaps.slice(0,6).map((g,i)=>({id:rid(),area:clean(g.area),severity:['high','medium','low'].includes(g.severity)?g.severity:'medium',
      finding:clean(g.finding),evidence:clean(g.evidence),fix:clean(g.fix),basis:g.basis==='notes'?'notes':'inferred',lead:i===0}));
    await patch(id,{gaps:{summary:clean(r.summary),hook:clean(r.hook),confidence:['high','medium','low'].includes(r.confidence)?r.confidence:'medium',
      items,targetRoles:(r.target_roles||[]).slice(0,4).map(clean),checkNext:(r.check_next||[]).slice(0,3).map(clean),at:nowIso()}});
    log(id,`Content gap read run (${items.length} gaps)`);
    if(state.clients[id].stage==='prospect')setStage(id,'gaps','Moved to Gaps');
  }catch(e){const m=errCopy(e);if(m)toast(m)}
  finally{busy.delete('gaps:'+id);render(true)}
}
async function runDraft(id,slot,tweak){
  const c=state.clients[id];const key='msg:'+id+':'+slot;if(!c||busy.has(key))return;
  const sample=await use('sample');if(!sample){toast('Claude is not available in this view.');return}
  busy.add(key);render(true);
  try{
    const S=SLOTS.find(s=>s.k===slot);const ch=(c.messages&&c.messages[slot]&&c.messages[slot].channel)||S.ch;
    const r=await sample.json(msgPrompt(c,slot,tweak),{cache:false});
    const body=clean(r&&r.body);if(!body)throw{code:'empty_completion'};
    await patch(id,{messages:{[slot]:{body,subject:ch==='Email'?clean(r.subject):'',channel:ch,draftedAt:nowIso()}}});
  }catch(e){const m=errCopy(e);if(m)toast(m)}
  finally{busy.delete(key);render(true)}
}

/* ---------- rendering ---------- */
function allClients(){return Object.entries(state.clients).map(([id,c])=>({id,...c}))}
function matches(c){
  if(state.filter!=='all'&&c.stage!==state.filter)return false;
  const q=state.q.trim().toLowerCase();
  return !q||[c.name,c.website,c.industry].some(x=>String(x||'').toLowerCase().includes(q));
}
function rank(c){const n=nextAction(c);return n.due?0:c.stage==='parked'?2:1}
function renderTop(){
  const due=allClients().filter(c=>nextAction(c).due).length;
  $('#dueChip').innerHTML=due?`<span class="chip warn">${due} follow-up${due===1?'':'s'} due</span>`:'';
  $('#banner').innerHTML=state.mode==='memory'?'<div class="topnote"><div class="wrap">The server could not be reached. Changes last until you close the page.</div></div>':'';
}
function renderList(){
  const all=allClients();const counts={all:all.length};
  STAGES.forEach(s=>counts[s.k]=all.filter(c=>c.stage===s.k).length);counts.parked=all.filter(c=>c.stage==='parked').length;
  const chips=[['all','All'],...STAGES.map(s=>[s.k,s.l]),['parked','Parked']].map(([k,l])=>
    `<button class="fchip" type="button" data-act="filter" data-v="${k}" aria-pressed="${state.filter===k}">${l} <b>${counts[k]||0}</b></button>`).join('');
  const rows=all.filter(matches).sort((a,b)=>rank(a)-rank(b)||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));

  else body=`<div class="rows">${rows.map(c=>{const n=nextAction(c);
    return `<button type="button" class="row" data-act="select" data-id="${esc(c.id)}" aria-current="${state.sel===c.id}">
      <span class="top"><span class="nm">${esc(c.name)}</span><span class="chip ${c.stage==='won'?'ok':c.stage==='parked'?'mute':''}">${esc(stageLabel(c.stage))}</span></span>

    <input type="search" id="q" placeholder="Search name, site, industry" value="${esc(state.q)}" autocomplete="off"></label>

    <div class="field"><label for="pMail">Email</label><input id="pMail" type="text" value="${esc(p.email)}"></div></div>
    <div class="field"><label for="pNote">Note</label><input id="pNote" type="text" value="${esc(p.note)}" placeholder="Posts about… / mutual connection…"></div>
    <div class="rowx"><button class="btn primary sm" type="button" data-act="poc-save" data-id="${esc(p.id||'')}">Save contact</button><button class="btn sm ghost" type="button" data-act="poc-cancel">Cancel</button></div></div>`}
function peoplePane(c){
  const pocs=c.pocs||[];const roles=(c.gaps&&c.gaps.targetRoles)||[];
  const li=r=>'https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent((c.name+' '+r).trim());
  const finder=`<div class="card stack"><div><h3>Find the person who owns content</h3><p class="hint" style="margin:4px 0 0">${roles.length?'Roles Claude suggests for a company like this. Each opens a LinkedIn people search.':'Run the gap read to get suggested roles. You can still search by hand.'}</p></div>
    <div class="roles">${(roles.length?roles:['Head of Marketing','Founder']).map(r=>`<a class="role" href="${esc(li(r))}" target="_blank" rel="noopener noreferrer">${esc(r)} ↗</a>`).join('')}
    <a class="role" href="${esc('https://www.linkedin.com/search/results/companies/?keywords='+encodeURIComponent(c.name))}" target="_blank" rel="noopener noreferrer">Company page ↗</a></div></div>`;
  const list=pocs.map(p=>state.ui.editPoc===p.id?pocForm(p):`<div class="card poc"><div><h3>${esc(p.name)} ${p.primary?'<span class="chip">Primary</span>':''}</h3>
    <div class="hint">${esc(p.role||'No role added')}${p.email?' · '+esc(p.email):''}</div>${p.note?`<div class="hint" style="margin-top:4px">${esc(p.note)}</div>`:''}
    ${p.linkedin?`<div style="margin-top:6px"><a href="${esc(normUrl(p.linkedin))}" target="_blank" rel="noopener noreferrer">LinkedIn profile ↗</a></div>`:'<div class="hint" style="margin-top:6px">No LinkedIn added</div>'}</div>
    <div class="rowx">${p.primary?'':`<button class="btn sm" type="button" data-act="poc-primary" data-id="${esc(p.id)}">Make primary</button>`}<button class="btn sm ghost" type="button" data-act="poc-edit" data-id="${esc(p.id)}">Edit</button><button class="btn sm ghost danger" type="button" data-act="poc-del" data-id="${esc(p.id)}">Remove</button></div></div>`).join('');
  return `${finder}${list}${state.ui.addPoc?pocForm():`<div><button class="btn" type="button" data-act="poc-add-open">Add contact</button></div>`}`;
}
function messagesPane(c){
  const d=dueInfo(c);const nextSlot=c.stage==='meeting'?'meeting':c.stage==='won'?'kickoff':d&&d.kind!=='done'?d.slot:(c.stage==='poc'?'outreach':null);
  const hasGap=!!((c.gaps&&c.gaps.items)||[]).length;const p=primaryPoc(c);
  return `<p class="hint" style="margin:0">${p?`Drafts address ${esc(p.name)}.`:'No contact yet. Drafts will not use a name.'} ${hasGap?'':'Run the gap read before drafting the first three messages.'}</p>`+
  SLOTS.map(S=>{
    const m=(c.messages&&c.messages[S.k])||{};const ch=m.channel||S.ch;const b=busy.has('msg:'+state.sel+':'+S.k);
    const locked=S.needs&&!hasGap;const wc=words(m.body);
    let status='<span class="chip mute">Not drafted</span>';
    if(m.sentAt)status=`<span class="chip ok">Sent ${esc(fmt(m.sentAt))}</span>`;
    else if(m.body)status='<span class="chip">Draft</span>';
    if(!m.sentAt&&d&&d.kind==='due'&&d.slot===S.k)status='<span class="chip warn">Due now</span>';
    return `<section class="card msg ${nextSlot===S.k?'next':''}" data-slot="${S.k}">
      <header><div><span class="lbl">${esc(S.tag)} · ${esc(S.day)}</span><h3>${esc(S.t)}</h3></div>${status}</header>
      <div class="opts"><div class="field"><label for="ch-${S.k}">Channel</label><select id="ch-${S.k}" data-ch="${S.k}">${CHANNELS.map(x=>`<option ${x===ch?'selected':''}>${x}</option>`).join('')}</select></div>
        ${ch==='Email'?`<div class="field"><label for="sub-${S.k}">Subject</label><input id="sub-${S.k}" type="text" data-edit="messages.${S.k}.subject" value="${esc(m.subject)}"></div>`:'<div></div>'}</div>
      <textarea id="body-${S.k}" data-edit="messages.${S.k}.body" data-wc="${S.k}" rows="7" placeholder="${locked?'Run the gap read first so this draft can say something specific.':'Draft with Claude, or write your own.'}">${esc(m.body)}</textarea>
      <div class="foot"><button class="btn ${m.body?'':'primary'} ${b?'thinking':''}" type="button" data-act="draft" data-slot="${S.k}" ${b||locked?'disabled':''}>${m.body?'Redraft':'Draft with Claude'}</button>
        ${m.body?['Shorter','Warmer','Sharper'].map(t=>`<button class="btn sm ghost" type="button" data-act="tweak" data-slot="${S.k}" data-v="${t}" ${b?'disabled':''}>${t}</button>`).join(''):''}
        <span class="sp"></span><span class="wc" id="wc-${S.k}">${wc?wc+' words':''}</span>
        <button class="btn sm" type="button" data-act="copy" data-slot="${S.k}" ${m.body?'':'disabled'}>Copy</button>
        ${m.sentAt?`<button class="btn sm ghost" type="button" data-act="unsent" data-slot="${S.k}">Undo sent</button>`:`<button class="btn sm primary" type="button" data-act="sent" data-slot="${S.k}" ${m.body?'':'disabled'}>Mark sent</button>`}</div></section>`}).join('');
}
function activityPane(c){
  const l=c.log||[];
  return `<div class="card stack"><div class="field"><label for="noteIn">Add a note</label><textarea id="noteIn" rows="3" placeholder="Call notes, replies, anything worth remembering"></textarea></div>
    <div><button class="btn sm" type="button" data-act="note-add">Save note</button></div></div>
    <div class="card">${l.length?`<ul class="log">${l.map(x=>`<li><time>${esc(fmt(x.at))}</time><span>${esc(x.text)}</span></li>`).join('')}</ul>`:'<span class="hint">Nothing yet. Stage changes and sent messages appear here.</span>'}</div>`;
}
function renderOverlay(){
  const o=$('#overlay');const k=state.overlay;
  if(!k){o.hidden=true;o.innerHTML='';return}
  o.hidden=false;
  if(k==='add'){
    o.className='overlay center';
    o.innerHTML=`<form class="sheet" id="addForm" autocomplete="off"><h2>Add prospect</h2><p class="hint" style="margin:0">A name or a website is enough. Add the rest as you learn it.</p>
      <div class="field"><label for="aName">Company name</label><input id="aName" type="text" placeholder="e.g. Northfield Dental"></div>
      <div class="field"><label for="aSite">Website</label><input id="aSite" type="text" placeholder="northfielddental.com"></div>
      <div class="field"><label for="aInd">Industry (optional)</label><input id="aInd" type="text" placeholder="e.g. dental clinics, D2C skincare"></div>
      <div class="rowx" style="justify-content:flex-end"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Add prospect</button></div></form>`;
    setTimeout(()=>$('#aName')&&$('#aName').focus(),30);
  }else if(k==='settings'){
    const p=state.settings;o.className='overlay';
    o.innerHTML=`<form class="sheet" id="setForm" autocomplete="off"><h2>Sender profile</h2><p class="hint" style="margin:0">Every draft and gap read uses this. Keep it factual.</p>
      <div class="two"><div class="field"><label for="sName">Your first name</label><input id="sName" type="text" value="${esc(p.senderName)}"></div>
      <div class="field"><label for="sRole">Title (optional)</label><input id="sRole" type="text" value="${esc(p.senderRole)}"></div></div>
      <div class="field"><label for="sOffer">What Mile 1 offers</label><textarea id="sOffer" rows="5">${esc(p.offer)}</textarea></div>
      <div class="field"><label for="sProof">Proof points</label><textarea id="sProof" rows="3" placeholder="Real results only, one per line. Drafts never invent any.">${esc(p.proof)}</textarea></div>
      <div class="field"><label for="sBook">Booking link</label><input id="sBook" type="text" value="${esc(p.booking)}" placeholder="https://cal.com/…"></div>
      <div class="field"><label for="sVoice">Extra voice notes</label><textarea id="sVoice" rows="2" placeholder="e.g. Never mention pricing. Use British spelling.">${esc(p.voice)}</textarea></div>
      <div class="rowx" style="justify-content:flex-end"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save profile</button></div></form>`;
  }
}
function render(force){
  renderTop();
  const a=document.activeElement;
  const typing=a&&$('#detail').contains(a)&&/^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
  const listTyping=a&&a.id==='q';
  if(!listTyping)renderList();
  if(force||!typing)renderDetail();
  $('#shell').dataset.view=state.sel&&state.clients[state.sel]?'detail':'list';
  if(!state.sel&&window.matchMedia('(min-width:861px)').matches)$('#shell').dataset.view='list';
}

/* ---------- actions ---------- */
function select(id){
  state.sel=id;const c=state.clients[id];
  state.ui={tab:!c?'gaps':(['poc','outreach','followup','meeting','won'].includes(c.stage)?(c.stage==='poc'?'people':'messages'):'gaps'),addPoc:false,editPoc:null,editHead:false,confirmDel:false};
  if(id&&location.hash!=='#c-'+id)location.hash='c-'+id;
  else if(!id&&location.hash)location.hash='';
  render(true);window.scrollTo({top:0});
}
function readHash(){
  const m=/^#c-(.+)$/.exec(location.hash);const id=m&&m[1];
  if(id&&state.clients[id]&&state.sel!==id){state.sel=id;const c=state.clients[id];state.ui.tab=c.stage==='poc'?'people':['outreach','followup','meeting','won'].includes(c.stage)?'messages':'gaps';render(true)}
  else if(!id&&state.sel){state.sel=null;render(true)}
}
async function addProspect(){
  const nm=$('#aName').value.trim(),site=$('#aSite').value.trim(),ind=$('#aInd').value.trim();
  if(!nm&&!site){$('#aName').focus();toast('Add a company name or a website.');return}
  const host=hostOf(site);const name=nm||titleFromHost(host)||'Untitled';
  const id=(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28)||'p')+'-'+rid();
  const t=nowIso();
  await createClient(id,{name,website:site?normUrl(site):'',industry:ind,stage:'prospect',createdAt:t,updatedAt:t,notes:'',pocs:[],messages:{},log:[{at:t,text:'Added to pipeline'}]});
  state.overlay=null;renderOverlay();select(id);
}
function pocFromForm(id){
  const g=x=>($(x).value||'').trim();const name=g('#pName');if(!name){toast('A contact needs a name.');return null}
  return{id:id||rid(),name,role:g('#pRole'),linkedin:g('#pLi')?normUrl(g('#pLi')):'',email:g('#pMail'),note:g('#pNote')}
}
async function copyText(slot){
  const c=state.clients[state.sel];const m=c.messages[slot];const text=(m.channel==='Email'&&m.subject?'Subject: '+m.subject+'\n\n':'')+m.body;
  try{await navigator.clipboard.writeText(text);toast('Copied')}
  catch{const ta=$('#body-'+slot);if(ta){ta.focus();ta.select();toast('Press Ctrl or Cmd + C to copy')}}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=state.sel,c=id&&state.clients[id];
  switch(act){
    case 'select':select(t.dataset.id);break;
    case 'back':select(null);break;
    case 'filter':state.filter=state.filter===t.dataset.v&&t.dataset.v!=='all'?'all':t.dataset.v;render();break;
    case 'add-open':state.overlay='add';renderOverlay();break;
    case 'settings-open':state.overlay='settings';renderOverlay();break;
    case 'close':state.overlay=null;renderOverlay();break;
    case 'tab':state.ui.tab=t.dataset.v;render(true);break;
    case 'stage':if(c)setStage(id,t.dataset.v);render(true);break;
    case 'park':if(c){setStage(id,'parked','Parked');render(true)}break;
    case 'reopen':if(c){setStage(id,c.prevStage||'prospect','Reopened');render(true)}break;
    case 'del':state.ui.confirmDel=true;render(true);break;
    case 'del-no':state.ui.confirmDel=false;render(true);break;
    case 'del-yes':{const d=id;state.sel=null;removeClient(d).then(()=>{location.hash='';render(true)});break}
    case 'edit-head':state.ui.editHead=!state.ui.editHead;render(true);break;
    case 'head-save':{const name=$('#hName').value.trim()||c.name;patch(id,{name,website:$('#hSite').value.trim()?normUrl($('#hSite').value):'',industry:$('#hInd').value.trim()});state.ui.editHead=false;render(true);break}
    case 'gaps-run':runGaps(id);break;
    case 'site-read':fetchSite(id);break;
    case 'gap-lead':{const items=c.gaps.items.map(x=>({...x,lead:x.id===t.dataset.id}));patch(id,{gaps:{items}});render(true);break}
    case 'gap-del':{let items=c.gaps.items.filter(x=>x.id!==t.dataset.id);if(items.length&&!items.some(x=>x.lead))items[0]={...items[0],lead:true};patch(id,{gaps:{items}});render(true);break}
    case 'poc-add-open':state.ui.addPoc=true;state.ui.editPoc=null;render(true);break;
    case 'poc-cancel':state.ui.addPoc=false;state.ui.editPoc=null;render(true);break;
    case 'poc-edit':state.ui.editPoc=t.dataset.id;state.ui.addPoc=false;render(true);break;
    case 'poc-save':{const p=pocFromForm(t.dataset.id);if(!p)break;
      let list=(c.pocs||[]).slice();const i=list.findIndex(x=>x.id===p.id);
      if(i>=0)list[i]={...list[i],...p};else{p.primary=!list.length;list.push(p)}
      patch(id,{pocs:list});if(i<0)log(id,`Added contact: ${p.name}`);
      if(['prospect','gaps'].includes(c.stage))setStage(id,'poc','Moved to POC');
      state.ui.addPoc=false;state.ui.editPoc=null;render(true);break}
    case 'poc-primary':patch(id,{pocs:c.pocs.map(x=>({...x,primary:x.id===t.dataset.id}))});render(true);break;
    case 'poc-del':{let list=c.pocs.filter(x=>x.id!==t.dataset.id);if(list.length&&!list.some(x=>x.primary))list[0]={...list[0],primary:true};patch(id,{pocs:list});render(true);break}
    case 'draft':runDraft(id,t.dataset.slot);break;
    case 'tweak':runDraft(id,t.dataset.slot,({Shorter:'Cut it by about a third without losing the observation.',Warmer:'Make the tone warmer and more personal, still plain and without flattery.',Sharper:'Make the observation more specific and the ask more direct.'})[t.dataset.v]);break;
    case 'copy':copyText(t.dataset.slot);break;
    case 'sent':{const s=t.dataset.slot,S=SLOTS.find(x=>x.k===s);
      patch(id,{messages:{[s]:{sentAt:nowIso()}}});log(id,`${S.t} sent via ${(c.messages[s].channel||S.ch)}`);
      if(s==='outreach'&&stageIdx(c.stage)<stageIdx('outreach'))setStage(id,'outreach','Moved to Outreach');
      else if(['fu1','fu2','final'].includes(s)&&stageIdx(c.stage)<stageIdx('followup'))setStage(id,'followup','Moved to Follow-up');
      render(true);break}
    case 'unsent':patch(id,{messages:{[t.dataset.slot]:{sentAt:null}}});render(true);break;
    case 'note-add':{const v=($('#noteIn').value||'').trim();if(v){log(id,'Note: '+v);render(true)}break}
    case 'clear-examples':{const ids=Object.keys(state.clients).filter(k=>state.clients[k].example);if(state.sel&&ids.includes(state.sel)){state.sel=null;location.hash=''}Promise.all(ids.map(removeClient)).then(()=>render(true));break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){state.q=t.value;renderList();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
  if(t.dataset.edit&&state.sel){edit(state.sel,t.dataset.edit,t.value);
    if(t.dataset.wc){const w=words(t.value);$('#wc-'+t.dataset.wc).textContent=w?w+' words':''}}
});
document.addEventListener('change',e=>{
  const t=e.target,id=state.sel;
  if(t.dataset.ch&&id){patch(id,{messages:{[t.dataset.ch]:{channel:t.value}}});render(true)}
  if(t.id==='meetAt'&&id){patch(id,{meetingAt:t.value?new Date(t.value+'T10:00:00').toISOString():null});render(true)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='addForm')addProspect();
  if(e.target.id==='setForm'){const g=x=>$(x).value.trim();
    await saveSettings({senderName:g('#sName'),senderRole:g('#sRole'),offer:g('#sOffer')||DEFAULT_PROFILE.offer,proof:g('#sProof'),booking:g('#sBook'),voice:g('#sVoice')});
    state.overlay=null;renderOverlay();toast('Sender profile saved')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay){state.overlay=null;renderOverlay()}});
$('#overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay'){state.overlay=null;renderOverlay()}});
window.addEventListener('hashchange',readHash);

/* ---------- boot ---------- */
async function boot(){
  render(true);
  const db=await use('db');
  if(!db){state.mode='memory';state.loaded=true;render(true);return}
  state.mode='db';API={db,col:db.collection('clients')};
  const slow=setTimeout(()=>{if(!state.loaded){state.loaded=true;toast('Saved data is taking a while to load. It will appear when it arrives.',6000);render(true)}},10000);
  API.col.onSnapshot(snap=>{
    clearTimeout(slow);const seen={};
    snap.docs.forEach(d=>{seen[d.id]=1;if(pendingEdits.get(d.id)>0)return;state.clients[d.id]=structuredClone(d.data())});
    if(!snap.metadata.fromCache||snap.size||true){Object.keys(state.clients).forEach(k=>{if(!seen[k]&&!queues.has(k))delete state.clients[k]})}
    state.loaded=true;
    if(state.sel&&!state.clients[state.sel]&&!/^#c-/.test(location.hash))state.sel=null;
    readHash();render(false);
  },err=>{state.loaded=true;toast('Could not load saved prospects ('+(err&&err.code||'error')+').');render(true)});
  db.doc('settings/profile').onSnapshot(s=>{if(s.exists)state.settings={...DEFAULT_PROFILE,...s.data()}},()=>{});
}
boot();
})();
</script>
</body>
</html>
