# Render Blueprint: one web service plus one Postgres database.
# In the Render dashboard choose New > Blueprint and point it at this repository.
# You will be asked for the two secrets marked sync: false.
services:
  - type: web
    name: mile1-outreach
    runtime: node
    plan: free              # free web services sleep after idle time; use "starter" to keep it awake
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD   # the one password that protects the whole app
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: DATABASE_URL
        fromDatabase:
          name: mile1-db
          property: connectionString

databases:
  - name: mile1-db
    plan: free              # check Render's current free-database limits; upgrade to keep data long term
